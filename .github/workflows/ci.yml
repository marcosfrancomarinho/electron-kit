name: CI

on:
  push:
  pull_request:

jobs:
  generator:
    name: Generator - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Tests
        run: npm test

      - name: Package dry run
        run: npm pack --dry-run

  package-native:
    name: Package React - ${{ matrix.target }}
    needs: generator
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install generator
        run: npm install

      - name: Build generator
        run: npm run build

      - name: Generate React fixture
        run: node test/generate-fixture.cjs fixture

      - name: Install generated project
        working-directory: fixture
        run: npm install

      - name: Package generated project
        working-directory: fixture
        run: npm run package -- ${{ matrix.target }}

      - name: Verify plain CSS
        working-directory: fixture
        run: node -e "const fs = require('node:fs'); const css = fs.readFileSync('src/ui/style.css','utf8'); const html = fs.readFileSync('index.html','utf8'); if (!css.includes('.app {') || !html.includes('./src/ui/style.css')) process.exit(1);"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: create-kit-electron-react-${{ matrix.target }}
          path: fixture/release/**
          if-no-files-found: error
